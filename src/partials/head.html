<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />

        <title data-i18n="{{TITLE_KEY}}">{{TITLE_TEXT}}</title>
        <meta name="description" data-i18n-content="{{DESC_KEY}}" content="{{DESC_TEXT}}" />
        <meta name="author" content="Guilherme Bonato" />

        <link rel="canonical" href="{{CANONICAL}}" />

        <meta property="og:type" content="website" />

        <meta property="og:title" content="{{TITLE_TEXT}}" />
        <meta property="og:description" content="{{DESC_TEXT}}" />
        <meta property="og:url" content="{{CANONICAL}}" />
        <meta property="og:image" content="https://github.com/moablive.png" />

        <meta name="twitter:description" content="{{DESC_TEXT}}" />
        <meta name="twitter:image" content="https://github.com/moablive.png" />

            rel="icon"

            />

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
            />
