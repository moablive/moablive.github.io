        <script>
            // Aplica o tema antes da primeira pintura — sem isto, quem prefere
            // escuro vê um flash branco a cada carregamento.
            (function () {
                try {
                    var salvo = localStorage.getItem("tema");
                    var escuro = salvo ? salvo === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
                    if (escuro) {
                        document.documentElement.classList.add("dark");
                        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0b12");
                    }
                } catch (e) {}
            })();
        </script>
