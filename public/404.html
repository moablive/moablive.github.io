<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Página não encontrada — Guilherme Bonato</title>
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#f0ede6" />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"
            rel="stylesheet"
            />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%BB</text></svg>"
            />
        <style>
            /* Página estática de propósito: não depende do bundle nem de CDN de CSS. */
            :root { --paper: #f0ede6; --ink: #101010; --accent: #e8380d; --sun: #ffd400; }
            * { box-sizing: border-box; }
            body {
                margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
                background: var(--paper); color: var(--ink);
                font-family: "Archivo", system-ui, sans-serif;
            }
            main { width: 100%; max-width: 560px; border: 3px solid var(--ink); background: #fff; box-shadow: 7px 7px 0 var(--ink); }
            .faixa { background: var(--accent); color: #fff; border-bottom: 3px solid var(--ink); padding: 28px 32px; }
            .num { font-family: "Archivo Black", system-ui, sans-serif; font-size: clamp(4rem, 18vw, 7rem); line-height: 0.85; letter-spacing: -0.05em; margin: 0; }
            .corpo { padding: 28px 32px 32px; }
            h1 { font-family: "Archivo Black", system-ui, sans-serif; font-size: 1.35rem; letter-spacing: -0.02em; text-transform: uppercase; margin: 0 0 14px; }
            p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; }
            p[lang="en"] { color: #3d3d3a; }
            a {
                display: inline-block; margin-top: 24px; padding: 14px 22px;
                border: 3px solid var(--ink); background: var(--sun); color: var(--ink);
                font-family: "Space Mono", ui-monospace, monospace; font-size: 12px; font-weight: 700;
                letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;
                transition: transform 0.15s ease;
            }
            a:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
            @media (prefers-reduced-motion: reduce) { a { transition: none; } }
        </style>
    </head>
    <body>
        <main>
            <div class="faixa"><p class="num">404</p></div>
            <div class="corpo">
                <h1>Página não encontrada</h1>
                <p>O endereço que você acessou não existe ou foi movido.</p>
                <p lang="en">The address you accessed does not exist or has been moved.</p>
                <a href="/">← Voltar para o início</a>
            </div>
        </main>
    </body>
</html>
