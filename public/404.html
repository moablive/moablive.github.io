<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Página não encontrada — Guilherme Bonato</title>
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#f6f7fb" />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
            rel="stylesheet"
            />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%BB</text></svg>"
            />
        <style>
            /* Estática de propósito: não depende do bundle nem de CDN de CSS.
               O tema escuro aqui vem só do sistema — não há JS para ler a escolha. */
            :root {
                --brand: #4b5ce8; --brand-2: #12c2e9;
                --canvas: #f6f7fb; --surface: #fff; --ink: #12141c; --ink-2: #4a4f60; --hairline: rgb(18 20 28 / 0.08);
            }
            @media (prefers-color-scheme: dark) {
                :root { --canvas: #0a0b12; --surface: #12141d; --ink: #e8eaf2; --ink-2: #a6acbe; --hairline: rgb(255 255 255 / 0.1); }
            }
            * { box-sizing: border-box; }
            body {
                margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
                background: var(--canvas); color: var(--ink);
                font-family: "Plus Jakarta Sans", system-ui, sans-serif;
                background-image:
                    radial-gradient(40rem 26rem at 15% -10%, color-mix(in oklab, var(--brand) 18%, transparent), transparent 70%),
                    radial-gradient(34rem 22rem at 90% 0%, color-mix(in oklab, var(--brand-2) 16%, transparent), transparent 70%);
                background-repeat: no-repeat;
            }
            main {
                width: 100%; max-width: 520px; text-align: center; padding: 44px 32px;
                background: color-mix(in oklab, var(--surface) 72%, transparent);
                backdrop-filter: blur(14px) saturate(140%);
                border: 1px solid var(--hairline); border-radius: 28px;
                box-shadow: 0 1px 2px rgb(18 20 28 / 0.04), 0 12px 32px -12px rgb(18 20 28 / 0.2);
            }
            .num {
                margin: 0; font-size: clamp(3.5rem, 16vw, 5.5rem); font-weight: 800; letter-spacing: -0.05em; line-height: 1;
                background-image: linear-gradient(100deg, var(--brand), var(--brand-2));
                background-clip: text; -webkit-background-clip: text; color: transparent;
            }
            h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; margin: 16px 0 12px; }
            p { margin: 0 0 6px; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
            a {
                display: inline-block; margin-top: 26px; padding: 13px 26px; border-radius: 999px;
                background: linear-gradient(100deg, var(--brand), var(--brand-2)); color: #fff;
                font-size: 14px; font-weight: 600; text-decoration: none; transition: opacity 0.2s ease;
            }
            a:hover { opacity: 0.9; }
            @media (prefers-reduced-motion: reduce) { a { transition: none; } }
        </style>
    </head>
    <body>
        <main>
            <p class="num">404</p>
            <h1>Página não encontrada</h1>
            <p>O endereço que você acessou não existe ou foi movido.</p>
            <p lang="en">The address you accessed does not exist or has been moved.</p>
            <a href="/">Voltar para o início</a>
        </main>
    </body>
</html>
